<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Viewer</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script src="script.js" defer></script>
    <style>
      h1,
      header {
        margin: 8px;
      }
      main {
        padding: 0;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      .checkbox {
        width: 30px;
        transform: translateY(10px);
      }
      .modifier {
        display: flex;
        flex-direction: row;
        gap: 20px;
      }
      #prompt {
        max-width: 590px;
        word-wrap: break-word;
        display: none;
      }
      #id1 {
        width: 150px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Interactive Viewer</h1>
    </header>
    <main>
      <div class="loader" lang="en">
        <p>
          Enter the interactive's material ID, then click Load Applet. Use the
          checkboxes to modify the way you view the applet.
        </p>
        <label for="id1">Material ID: </label><input id="id1" type="text" />
        <button id="load">Load Applet</button>
        <div class="modifier">
          <form>
            <div>
              <input id="prompt-checkbox" type="checkbox" class="checkbox" />
              <label for="prompt-checkbox">Show Prompt? </label>
            </div>
            <div>
              <input id="debug-checkbox" type="checkbox" class="checkbox" />
              <label for="debug-checkbox">Enable GeoGebra Debug? </label>
            </div>
            <div>
              <input id="language-checkbox" type="checkbox" class="checkbox" />
              <label for="language-checkbox">View in Spanish? </label>
            </div>
          </form>
          <div id="results">
            <p id="prompt"></p>
            <p id="scoring"></p>
          </div>
        </div>
      </div>
      <div id="ggb-container">
        <div id="ggb-element"></div>
      </div>
    </main>

    <p id="broken-click" class="hidden">Maybe coming soon?</p>
    <script>
      function clickFunction() {
        document.querySelector("#broken-click").classList.remove("hidden");
        setTimeout(() => {
          document.querySelector("#broken-click").classList.add("hidden");
          window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        }, 2000);
      }
    </script>
  </body>
</html>
